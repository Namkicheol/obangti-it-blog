<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" style="max-width:100%;height:auto;">
  <!-- 배경 -->
  <rect width="800" height="450" fill="#0f172a"/>

  <!-- 배경 그라디언트 효과 -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#1e3a5f" stop-opacity="1"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
  </radialGradient>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- 빨간 경고 사선 줄무늬 (상단) -->
  <rect x="0" y="0" width="800" height="8" fill="#c53030"/>

  <!-- 왼쪽 강조 세로선 -->
  <rect x="0" y="0" width="6" height="450" fill="#c53030"/>

  <!-- 중앙 아이콘 영역 (⚠️ 스타일) -->
  <polygon points="400,60 460,160 340,160" fill="none" stroke="#f6ad55" stroke-width="5" stroke-linejoin="round"/>
  <text x="400" y="148" text-anchor="middle" font-size="56" font-family="serif" fill="#f6ad55" font-weight="bold">!</text>

  <!-- 메인 제목 -->
  <text x="400" y="215" text-anchor="middle" font-size="38" font-weight="bold" fill="#ffffff" font-family="sans-serif">클로드가 일부러</text>
  <text x="400" y="263" text-anchor="middle" font-size="38" font-weight="bold" fill="#fc8181" font-family="sans-serif">멍청해졌다?</text>

  <!-- 서브 텍스트 -->
  <rect x="120" y="285" width="560" height="2" fill="#475569"/>
  <text x="400" y="318" text-anchor="middle" font-size="20" fill="#94a3b8" font-family="sans-serif">Anthropic이 직접 인정한 충격 사실</text>

  <!-- 수치 배지들 -->
  <rect x="90" y="345" width="180" height="52" rx="6" fill="#1e293b" stroke="#3182ce" stroke-width="1.5"/>
  <text x="180" y="367" text-anchor="middle" font-size="11" fill="#93c5fd" font-family="sans-serif">분석 세션 수</text>
  <text x="180" y="388" text-anchor="middle" font-size="18" font-weight="bold" fill="#60a5fa" font-family="sans-serif">6,852개</text>

  <rect x="310" y="345" width="180" height="52" rx="6" fill="#1e293b" stroke="#c53030" stroke-width="1.5"/>
  <text x="400" y="367" text-anchor="middle" font-size="11" fill="#fca5a5" font-family="sans-serif">인정된 변경사항</text>
  <text x="400" y="388" text-anchor="middle" font-size="18" font-weight="bold" fill="#f87171" font-family="sans-serif">3가지</text>

  <rect x="530" y="345" width="180" height="52" rx="6" fill="#1e293b" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="620" y="367" text-anchor="middle" font-size="11" fill="#fdba74" font-family="sans-serif">Firefox 취약점 발견</text>
  <text x="620" y="388" text-anchor="middle" font-size="18" font-weight="bold" fill="#fb923c" font-family="sans-serif">271개</text>

  <!-- 하단 태그 -->
  <text x="400" y="432" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">2026.04 · AI/최신뉴스 · obangti.tistory.com</text>
</svg>
